name: Publish custom Mattermost image

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mattermost-custom-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/neutron-1985/mattermost

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to neutron-1985 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/neutron-1985/mattermost-delivery
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=mattermost-custom
          cache-to: type=gha,mode=max,scope=mattermost-custom
